<!DOCTYPE html>
<html>
<head>
  <title>Email Extractor</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 12px; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    #output { margin-top: 20px; padding: 10px; background: #f0f0f0; display: none; }
  </style>
</head>
<body>
  <h1>Email HTML Extractor</h1>
  <p>Paste the full JSON response below:</p>
  <textarea id="jsonInput" placeholder='{"to":[],"body":"<!DOCTYPE html>..."}'></textarea>
  <br>
  <button onclick="extract()">Extract & Preview</button>
  <button onclick="copyHtml()">Copy HTML</button>
  <div id="output">
    <strong>Extracted HTML:</strong>
    <pre id="preview" style="max-height: 200px; overflow: auto;"></pre>
  </div>

  <script>
    let extractedHtml = '';

    function extractBody(raw) {
      // Try standard JSON.parse first (Thunder Client responses)
      try { return JSON.parse(raw).body; } catch (_) {}
      // Fallback: extract body field directly (Postman responses with
      // embedded JS escapes like \x22 that break JSON.parse)
      const start = raw.indexOf('"body": "');
      if (start === -1) return null;
      const bodyStart = start + 9;
      const bodyEnd = raw.lastIndexOf('",');
      if (bodyEnd <= bodyStart) return null;
      return raw.substring(bodyStart, bodyEnd).replace(/\\"/g, '"');
    }

    function extract() {
      try {
        const raw = document.getElementById('jsonInput').value;
        extractedHtml = extractBody(raw);
        if (!extractedHtml) throw new Error('Could not find "body" field in JSON');
        document.getElementById('preview').textContent = extractedHtml.substring(0, 500) + '...';
        document.getElementById('output').style.display = 'block';
        // Open in new tab
        const win = window.open('', '_blank');
        win.document.write(extractedHtml);
        win.document.close();
      } catch (e) {
        alert('Error parsing JSON: ' + e.message);
      }
    }

    function copyHtml() {
      if (extractedHtml) {
        navigator.clipboard.writeText(extractedHtml);
        alert('HTML copied to clipboard!');
      } else {
        alert('Extract first!');
      }
    }
  </script>
</body>
</html>
