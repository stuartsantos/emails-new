<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-sans); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tile { border: 1px solid #E6E7E8; border-radius: 6px; padding: 18px; display:flex; flex-direction:column; align-items:center; gap: 10px; background:#F6F6F6; }
  .tile img { width: 48px; height: 48px; }
  .name { font: 600 13px/1.2 var(--font-sans); color: var(--midnight); }
  .label { font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="label">Brand icons · map pin & speech-bubble system marks</p>
  <div class="grid">
    <div class="tile"><img src="../brand/icon-mappin-navy.svg" alt=""><div class="name">Map Pin · Navy</div></div>
    <div class="tile" style="background:#003D6E"><img src="../brand/icon-mappin-navy.svg" alt="" style="filter: brightness(0) invert(1)"><div class="name" style="color:#fff">Map Pin · White</div></div>
    <div class="tile" style="background:#EDE8DE"><img src="../brand/icon-mappin-navy.svg" alt=""><div class="name">Map Pin · Sand</div></div>
    <div class="tile"><img src="../brand/icon-speech-bubbles.svg" alt=""><div class="name">Speech Bubbles</div></div>
  </div>
</body></html>
