<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; min-width:0; }
  .chip { height:84px; border-radius:6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { margin-top:10px; font: 700 13px/1.2 var(--font-sans); color: var(--midnight); }
  .meta { margin-top:2px; font: 400 11px/1.3 var(--font-sans); color: var(--midnight-50); }
  .label { font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="label">Neutrals · text & surfaces</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1C252E"></div><div class="name">Midnight</div><div class="meta">#1C252E · gray-7 · body text</div></div>
    <div class="sw"><div class="chip" style="background:#555B62"></div><div class="name">Midnight 50</div><div class="meta">#555B62 · gray-6 · secondary</div></div>
    <div class="sw"><div class="chip" style="background:#8D9296"></div><div class="name">Midnight 30</div><div class="meta">#8D9296 · gray-5 · placeholder</div></div>
    <div class="sw"><div class="chip" style="background:#C6C8CB"></div><div class="name">Midnight 15</div><div class="meta">#C6C8CB · gray-3 · borders</div></div>
    <div class="sw"><div class="chip" style="background:#E6E7E8"></div><div class="name">Midnight 10</div><div class="meta">#E6E7E8 · gray-2 · divider</div></div>
    <div class="sw"><div class="chip" style="background:#F6F6F6"></div><div class="name">Gray 1</div><div class="meta">#F6F6F6 · subtle bg</div></div>
  </div>
</body></html>
