<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Headers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display:flex; align-items:baseline; gap:24px; padding: 8px 0; border-bottom: 1px solid #E6E7E8; }
  .row:last-child { border-bottom: none; }
  .tag { width: 64px; flex: 0 0 64px; font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; }
  .meta { margin-left:auto; font: 400 11px/1 var(--font-sans); color: var(--midnight-50); white-space: nowrap; }
  .specimen { color: var(--tg-navy); font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="row"><span class="tag">H1</span><span class="specimen" style="font-weight:700; font-size:38px; line-height:1.1">Travel covered.</span><span class="meta">Noto Sans Bold · 38/42</span></div>
  <div class="row"><span class="tag">H2</span><span class="specimen" style="font-weight:700; font-size:30px; line-height:1.2">Plans for every trip</span><span class="meta">Noto Sans Bold · 30/36</span></div>
  <div class="row"><span class="tag">H3</span><span class="specimen" style="font-weight:600; font-size:24px; line-height:1.25">Coverages included</span><span class="meta">Noto Sans SemiBold · 24/30</span></div>
  <div class="row"><span class="tag">H4</span><span class="specimen" style="font-weight:600; font-size:18px; line-height:1.4">Trip Cancellation</span><span class="meta">Noto Sans SemiBold · 18/25</span></div>
</body></html>
