<!doctype html>
<html><head><meta charset="utf-8"><title>Primary Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; min-width:0; }
  .chip { height:84px; border-radius:6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .name { margin-top:10px; font: 700 13px/1.2 var(--font-sans); color: var(--midnight); }
  .meta { margin-top:2px; font: 400 11px/1.3 var(--font-sans); color: var(--midnight-50); font-feature-settings: "tnum"; }
  .label { font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="label">Primary palette · Travel Guard</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#003D6E"></div><div class="name">TG Navy</div><div class="meta">#003D6E · Blue 4</div></div>
    <div class="sw"><div class="chip" style="background:#2167AE"></div><div class="name">Zurich Blue</div><div class="meta">#2167AE · Blue 3</div></div>
    <div class="sw"><div class="chip" style="background:#9CC7E6"></div><div class="name">Snowmelt Blue</div><div class="meta">#9CC7E6 · Blue 2</div></div>
    <div class="sw"><div class="chip" style="background:#E4EDF8"></div><div class="name">Glacier Blue</div><div class="meta">#E4EDF8 · Blue 6</div></div>
    <div class="sw"><div class="chip" style="background:#302261"></div><div class="name">Night Sky</div><div class="meta">#302261 · Blue 5</div></div>
  </div>
</body></html>
