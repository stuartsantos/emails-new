<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic / UX Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-sans); }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .col h6 { color: var(--midnight-50); font: 700 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 8px; }
  .ramp { display:flex; height: 52px; border-radius:6px; overflow:hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .step { flex:1; display:flex; align-items:flex-end; padding:6px; font: 700 10px/1 var(--font-sans); color: rgba(0,0,0,0.5); }
  .step.dark { color: rgba(255,255,255,0.85); }
  .label { font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="label">UX state colors · alerts, validation, feedback</p>
  <div class="row">
    <div class="col"><h6>Info</h6><div class="ramp">
      <div class="step" style="background:#E4EDF8">50</div>
      <div class="step" style="background:#9CC7E6">200</div>
      <div class="step dark" style="background:#2167AE">500</div>
      <div class="step dark" style="background:#0E4E88">900</div>
    </div></div>
    <div class="col"><h6>Success</h6><div class="ramp">
      <div class="step" style="background:#ECFDF3">50</div>
      <div class="step" style="background:#A6F4C5">200</div>
      <div class="step dark" style="background:#039855">600</div>
      <div class="step dark" style="background:#054F31">900</div>
    </div></div>
    <div class="col"><h6>Warning</h6><div class="ramp">
      <div class="step" style="background:#FFFAEB">50</div>
      <div class="step" style="background:#FEDF89">200</div>
      <div class="step dark" style="background:#F79009">500</div>
      <div class="step dark" style="background:#7A2E0E">900</div>
    </div></div>
    <div class="col"><h6>Error</h6><div class="ramp">
      <div class="step" style="background:#FEF3F2">50</div>
      <div class="step" style="background:#FECDCA">200</div>
      <div class="step dark" style="background:#D92D20">600</div>
      <div class="step dark" style="background:#7A271A">900</div>
    </div></div>
  </div>
</body></html>
