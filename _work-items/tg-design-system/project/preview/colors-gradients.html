<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Gradients</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-sans); }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .grad { height: 110px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); }
  .name { margin-top:10px; font: 700 13px/1.2 var(--font-sans); color: var(--midnight); }
  .meta { margin-top:2px; font: 400 11px/1.3 var(--font-sans); color: var(--midnight-50); }
  .label { font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
</style>
</head>
<body>
  <p class="label">Brand gradients · backgrounds & color blocks</p>
  <div class="row">
    <div><div class="grad" style="background:linear-gradient(135deg,#64C5B9,#66CBE1)"></div><div class="name">Tropics</div><div class="meta">Seafoam → Lagoon</div></div>
    <div><div class="grad" style="background:linear-gradient(135deg,#FFC709,#F15F40)"></div><div class="name">Golden Hour</div><div class="meta">Amber → Terra Cotta</div></div>
    <div><div class="grad" style="background:linear-gradient(135deg,#DB5989,#302261)"></div><div class="name">Dusk</div><div class="meta">Watermelon → Night Sky</div></div>
    <div><div class="grad" style="background:linear-gradient(135deg,#A5D069,#005F62)"></div><div class="name">Woodland</div><div class="meta">Jungle → Deep Sea Green</div></div>
  </div>
</body></html>
