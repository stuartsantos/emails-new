<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:#fff; font-family: var(--font-sans); display:grid; grid-template-columns: 1fr 1fr; min-height: 280px; }
  .light, .dark { display:flex; align-items:center; justify-content:center; padding: 40px; position: relative; }
  .dark { background: #003D6E; }
  .label { position: absolute; top: 16px; left: 16px; font: 700 11px/1 var(--font-sans); color: var(--zurich-blue); letter-spacing: 0.1em; text-transform: uppercase; }
  .label.on-dark { color: #9CC7E6; }
  img { width: 280px; height: auto; display: block; }
</style>
</head>
<body>
  <div class="light">
    <span class="label">Primary · on light</span>
    <img src="../brand/logo-tg-navy.svg" alt="Travel Guard">
  </div>
  <div class="dark">
    <span class="label on-dark">Reverse · on TG Navy</span>
    <img src="../brand/logo-tg-white.svg" alt="Travel Guard">
  </div>
</body></html>
